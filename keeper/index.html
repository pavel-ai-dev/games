<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0710">
<title>Хранитель Часов</title>
<style>
  html,body{margin:0;height:100%;background:#0b0710;overflow:hidden;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
  #err{position:fixed;left:8px;top:8px;right:8px;color:#ff8a8a;font:12px monospace;white-space:pre-wrap;z-index:9;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="err"></div>
<script>
window.addEventListener('error',function(e){var d=document.getElementById('err');if(d)d.textContent+=(e.message||'error')+' @'+(e.filename||'').split('/').pop()+':'+e.lineno+'\n';});
</script>
<script src="js/util.js?v=1"></script>
<script src="js/input.js?v=1"></script>
<script src="js/art.js?v=2"></script>
<script src="js/art2.js?v=2"></script>
<script src="js/world.js?v=1"></script>
<script src="js/zones.js?v=1"></script>
<script src="js/entities.js?v=1"></script>
<script src="js/player.js?v=1"></script>
<script src="js/enemies.js?v=1"></script>
<script src="js/bosses.js?v=1"></script>
<script src="js/game.js?v=1"></script>
</body>
</html>
