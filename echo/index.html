<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ЭХО</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --c: #7ff6ff; --g: #ffc84a; --ui: rgba(20, 24, 60, .55); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0d24; color: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; touch-action: none; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }

  /* Меню */
  #menu { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: flex-start; padding: calc(env(safe-area-inset-top) + 7vh) 18px 24px; background: radial-gradient(ellipse at 50% 30%, rgba(10,13,36,.15), rgba(10,13,36,.85) 75%); overflow-y: auto; }
  #menu.on { display: flex; animation: fade .5s; }
  .logo { font-size: clamp(64px, 20vw, 120px); font-weight: 200; letter-spacing: .35em; margin-right: -.35em; color: #fff; text-shadow: 0 0 18px var(--c), 0 0 60px #5fd8ff88; position: relative; }
  .logo::after { content: 'ЭХО'; position: absolute; left: 0; top: 0; color: transparent; text-shadow: 0 0 2px #5fd8ff; transform: translate(10px, 6px); opacity: .35; animation: echo 3s ease-in-out infinite; }
  @keyframes echo { 0%,100% { transform: translate(6px, 4px); opacity: .15 } 50% { transform: translate(16px, 10px); opacity: .45 } }
  .tag { opacity: .6; font-size: 15px; letter-spacing: .08em; margin: 4px 0 28px; }
  #play { font-size: 22px; font-weight: 600; letter-spacing: .15em; padding: 18px 64px; border-radius: 999px; background: linear-gradient(135deg, #fff2d6, #7ff6ff); color: #0a0d24; box-shadow: 0 0 40px #7ff6ff66; animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe { 50% { box-shadow: 0 0 70px #7ff6ffaa; transform: scale(1.03) } }
  #stars { margin: 22px 0 10px; color: var(--g); letter-spacing: .1em; font-size: 15px; }
  #grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: min(420px, 100%); }
  .lv { background: var(--ui); border: 1px solid #ffffff1c; border-radius: 14px; padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 1px; backdrop-filter: blur(6px); }
  .lv b { font-size: 20px; font-weight: 600; }
  .lv span { font-size: 9.5px; opacity: .65; white-space: nowrap; overflow: hidden; max-width: 100%; }
  .lv em { font-style: normal; font-size: 10px; color: var(--g); letter-spacing: 1px; }
  .lv.locked { opacity: .35; } .lv.done { border-color: #7ff6ff55; }
  .row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; justify-content: center; }
  .row button { background: var(--ui); padding: 10px 16px; border-radius: 12px; font-size: 14px; border: 1px solid #ffffff1c; }

  /* Игровой HUD */
  #hud { position: absolute; inset: 0; pointer-events: none; display: none; }
  #hud.on { display: block; }
  #bartrack { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #ffffff10; }
  #bar { height: 100%; background: linear-gradient(90deg, #5fd8ff, #fff2d6); transform-origin: left; transform: scaleX(0); box-shadow: 0 0 10px #7ff6ff; }
  .top { position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 12px; right: 12px; display: flex; align-items: center; justify-content: space-between; }
  .hbtn { pointer-events: auto; width: 46px; height: 46px; border-radius: 50%; background: var(--ui); backdrop-filter: blur(6px); border: 1px solid #ffffff22; font-size: 19px; display: grid; place-items: center; }
  .mid { text-align: center; }
  #lname { font-size: 13px; letter-spacing: .25em; opacity: .7; text-transform: uppercase; }
  #pips { display: flex; gap: 7px; justify-content: center; margin-top: 7px; }
  #pips i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid #7ff6ff99; }
  #pips i.used { background: #5fd8ff; border-color: #5fd8ff; box-shadow: 0 0 8px #5fd8ff; opacity: .55; }
  #pips i.cur { background: #fff2d6; border-color: #fff2d6; box-shadow: 0 0 10px #fff2d6; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { transform: scale(1.3) } }

  #toast { position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 12vh); transform: translate(-50%, 20px); opacity: 0; transition: .45s; pointer-events: none; font-size: 17px; letter-spacing: .06em; text-align: center; width: 90%; text-shadow: 0 2px 12px #000; }
  #toast.show { opacity: .95; transform: translate(-50%, 0); }
  #toast.whisper { font-style: italic; color: #d9b8ff; text-shadow: 0 0 14px #b46bff; }
  #toast.title { font-size: 22px; letter-spacing: .3em; }

  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  #flash.rewind { animation: rw .8s ease-out; background: radial-gradient(circle, #5fd8ff55, #1a0f4acc); }
  #flash.win { animation: rw 1s ease-out; background: radial-gradient(circle, #fff2d688, transparent 70%); }
  @keyframes rw { 0% { opacity: 0 } 25% { opacity: 1 } 100% { opacity: 0 } }

  #panel { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: #05061acc; backdrop-filter: blur(4px); padding: 20px; }
  #panel.on { display: flex; animation: fade .3s; }
  .card { background: linear-gradient(160deg, #1b2257ee, #120f33ee); border: 1px solid #7ff6ff33; border-radius: 24px; padding: 28px 22px 22px; width: min(360px, 100%); text-align: center; box-shadow: 0 20px 60px #000a, 0 0 40px #5fd8ff22; animation: pop .35s cubic-bezier(.2, 1.6, .5, 1); }
  .card h2 { margin: 0 0 6px; font-weight: 300; letter-spacing: .12em; font-size: 24px; }
  .card p { opacity: .75; line-height: 1.5; margin: 10px 0 20px; }
  .big-stars { font-size: 46px; letter-spacing: 8px; margin: 10px 0 0; }
  .big-stars i { font-style: normal; color: #ffffff22; display: inline-block; }
  .big-stars i.on { color: var(--g); text-shadow: 0 0 20px var(--g); animation: star .5s both; }
  @keyframes star { 0% { transform: scale(0) rotate(-90deg) } 70% { transform: scale(1.4) } 100% { transform: scale(1) } }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btns button { flex: 1; min-width: 90px; padding: 15px 10px; border-radius: 14px; background: #ffffff14; font-size: 16px; }
  .btns button.main { background: linear-gradient(135deg, #fff2d6, #7ff6ff); color: #0a0d24; font-weight: 600; }
  @keyframes fade { from { opacity: 0 } }
  @keyframes pop { from { transform: scale(.85); opacity: 0 } }
  #err { position: absolute; left: 10px; right: 10px; bottom: 10px; color: #ff8080; font: 12px monospace; white-space: pre-wrap; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div id="bartrack"><div id="bar"></div></div>
    <div class="top">
      <button class="hbtn" id="pausebtn" aria-label="Пауза">❚❚</button>
      <div class="mid"><div id="lname"></div><div id="pips"></div></div>
      <button class="hbtn" id="rwbtn" aria-label="Закончить петлю">↺</button>
    </div>
    <div id="toast"></div>
  </div>
  <div id="flash"></div>
  <div id="menu">
    <div class="logo">ЭХО</div>
    <div class="tag">каждая попытка остаётся</div>
    <button id="play">ИГРАТЬ</button>
    <div id="stars"></div>
    <div id="grid"></div>
    <div class="row"><button id="snd"></button><button id="qlt"></button></div>
  </div>
  <div id="panel"></div>
  <div id="err"></div>
</div>
<script>addEventListener('error', e => { document.getElementById('err').textContent += (e.message || e) + '\n'; });</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
